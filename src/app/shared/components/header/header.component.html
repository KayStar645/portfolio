<div class="header">
  <div class="container d-flex justify-content-between w-100 h-100">

    <div class="d-flex align-items-center">
      <a routerLink="/" class="nav-link d-flex align-items-center h-100 ps-2 pe-5">
        <img [src]="user.avatar" class="rounded-circle me-3" width="36">
        <span>{{ user.name }}</span>
      </a>
    </div>

    <div class="d-flex align-items-center">
      <a *ngFor="let item of items" [routerLink]="item.link"
      class="nav-link d-flex align-items-center text-decoration-none text-light px-4 h-100">
        <i [class]="item.icon + ' me-2'"></i>
        <span>{{ item.name | translate }}</span>
      </a>
    </div>


    <div class="d-flex align-items-center">
      <a (click)="translateText('en-US')" class="nav-link d-flex align-items-center h-100">
        <i class="fas fa-globe-asia px-3 fa-lg"></i>
      </a>
      <a (click)="translateText('en-US')" class="nav-link d-flex align-items-center h-100">
        <i class="far fa-moon px-3 fa-lg"></i>
      </a>
      <a (click)="translateText('vi-VN')" class="nav-link d-flex align-items-center h-100">
        <i class="fas fa-sun px-3 fa-lg"></i>
      </a>
    </div>
  </div>
</div>
