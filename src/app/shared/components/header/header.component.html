<a class="skip-link" href="#main-content">{{ 'a11y.skip' | translate }}</a>
<header class="site-header">
  <div class="reading-progress" [style.width.%]="readingProgress" aria-hidden="true"></div>
  <div class="container header-inner" *ngIf="user$ | async as user">
    <a routerLink="/" class="brand" aria-label="KayStar portfolio home"><img [src]="user.avatar" alt="" class="brand-avatar"><span><strong>Thuan <i>/</i> KayStar</strong><small>Software Engineer</small></span></a>
    <nav class="desktop-nav" [attr.aria-label]="'a11y.primaryNav' | translate"><a *ngFor="let link of links" [routerLink]="link.route" routerLinkActive="active">{{ link.label | translate }}</a></nav>
    <div class="header-actions">
      <button class="icon-button language-button" type="button" (click)="switchLanguage()" [attr.aria-label]="currentLang === 'en-US' ? 'Chuyển sang Tiếng Việt' : 'Switch to English'"><app-icon name="language" /><span>{{ currentLang === 'en-US' ? 'VI' : 'EN' }}</span></button>
      <button class="icon-button" type="button" (click)="toggleTheme()" [attr.aria-label]="currentTheme === 'dark' ? ('a11y.lightMode' | translate) : ('a11y.darkMode' | translate)"><app-icon [name]="currentTheme === 'dark' ? 'sun' : 'moon'" /></button>
      <button #menuButton class="icon-button menu-button" type="button" (click)="toggleMenu()" [attr.aria-expanded]="isMenuVisible" aria-controls="mobile-navigation" [attr.aria-label]="isMenuVisible ? ('a11y.closeMenu' | translate) : ('a11y.openMenu' | translate)"><app-icon [name]="isMenuVisible ? 'close' : 'menu'" /></button>
    </div>
  </div>
</header>
<div class="menu-backdrop" *ngIf="isMenuVisible" (click)="closeMenu(true)" aria-hidden="true"></div>
<aside #mobileDrawer id="mobile-navigation" class="mobile-drawer" *ngIf="isMenuVisible" role="dialog" aria-modal="true" [attr.aria-label]="'a11y.mobileNav' | translate">
  <div class="drawer-label mono">{{ 'header.navigation' | translate }}</div>
  <nav>
    <a *ngFor="let link of links; let i = index" [routerLink]="link.route" routerLinkActive="active"><span class="mono">0{{ i + 1 }}</span>{{ link.label | translate }}<app-icon name="arrow" /></a>
    <a routerLink="/achievement"><span class="mono">05</span>{{ 'nav.achievements' | translate }}<app-icon name="arrow" /></a>
    <a routerLink="/education"><span class="mono">06</span>{{ 'nav.education' | translate }}<app-icon name="arrow" /></a>
  </nav>
</aside>
