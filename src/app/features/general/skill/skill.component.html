<section class="section-page" id="skill">
  <div class="container">
    <header class="page-intro" appReveal>
      <p class="eyebrow">{{ 'skill.eyebrow' | translate }}</p>
      <h1>{{ 'skill.title' | translate }}</h1>
      <p>{{ 'skill.description' | translate }}</p>
    </header>

    <div class="expertise-list" *ngIf="groupedSkills$ | async as groups">
      <section
        class="expertise-group"
        *ngFor="let group of groups; let index = index; trackBy: trackByGroup"
        appReveal
        [revealDelay]="index * 70"
      >
        <div class="group-index">0{{ index + 1 }}</div>
        <header>
          <div class="group-icon" aria-hidden="true">
            <app-icon [name]="groupIcon(group.group_id)" [size]="24" />
          </div>
          <div>
            <h2>{{ group.group_name }}</h2>
            <p>{{ ('skill.groupDescriptions.' + group.group_id) | translate }}</p>
          </div>
        </header>

        <div class="skill-list">
          <ng-container *ngFor="let skill of group.items; trackBy: trackBySkill">
            <a *ngIf="skill.url; else plainSkill" [href]="skill.url" target="_blank" rel="noopener">
              {{ skill.name }}<app-icon name="external" [size]="13" />
            </a>
            <ng-template #plainSkill><span>{{ skill.name }}</span></ng-template>
          </ng-container>
        </div>
      </section>
    </div>
  </div>
</section>
