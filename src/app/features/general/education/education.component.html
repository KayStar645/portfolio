<div id="education" class="h-100">
  <div class="container-lg">
    <h1 class="text-center py-5" style="font-size: 4.4rem; font-weight: 800">
      {{ 'modules.education' | translate }}
    </h1>

    <div class="row g-4">
      <ng-container *ngFor="let item of educations; ; let i = index">

        <div *ngIf="i % 2 == 1" class="col-md-4 col-lg-6"></div>

        <div class="col-md-8 col-lg-6">
          <div class="card p-4 pb-0 rounded-4"
            style="background-color: var(--bg-color); border: 1px solid var(--secondary)">

            <!-- Nếu màn hình nhỏ (sm) thì hiển thị ảnh ở trên -->
            <div class="d-sm-block d-md-none text-center mb-3">
              <img [src]="item.image" alt="Logo" class="rounded w-50 zoom-effect">
              <p style="color: var(--secondary-text);" class="fst-italic mt-2">
                {{ item.label }}
              </p>
            </div>

            <div class="d-md-flex">
              <!-- Nếu màn hình lớn hơn sm thì hiển thị ảnh bên trái -->
              <div *ngIf="i % 2 == 1" class="me-3 d-none d-md-flex flex-column align-items-center"
                style="flex: 0 0 30%;">
                <img [src]="item.image" alt="Logo" class="rounded w-100 zoom-effect">
                <p style="color: var(--secondary-text);"
                  class="text-center d-flex align-items-center justify-content-center flex-grow-1 fst-italic">
                  {{ item.label }}
                </p>
              </div>

              <div style="flex: 1;">
                <div class="d-flex align-items-center">
                  <img src="assets/params/images/educations/icon.jpg" alt="Logo"
                    class="me-3 rounded" width="40">
                  <div>
                    <h5 class="fw-bold fs-5"
                      style="color: var(--secondary-text); line-height: 1.3;">
                      {{ item.name }}
                    </h5>
                  </div>
                </div>
                <div class="mt-3" style="color: var(--secondary-text);">
                  <div class style="height: 1px; background: var(--main-close);"></div>

                  <p class="py-3" style="line-height: 1.3;">
                    <i class="fas fa-map-marker-alt me-2"></i>
                    {{ item.address }}
                  </p>

                  <div class style="height: 1px; background: var(--main-close);"></div>

                  <p class="py-3" style="line-height: 1.3;">
                    <i class="fas fa-clock me-2"></i>
                    {{ item.time }}
                  </p>
                </div>
              </div>

              <!-- Nếu màn hình lớn hơn sm thì hiển thị ảnh bên phải -->
              <div *ngIf="i % 2 == 0" class="ms-3 d-none d-md-flex flex-column align-items-center"
                style="flex: 0 0 30%;">
                <img [src]="item.image" alt="Logo" class="rounded w-100 zoom-effect">
                <p style="color: var(--secondary-text);"
                  class="text-center d-flex align-items-center justify-content-center flex-grow-1 fst-italic">
                  {{ item.label }}
                </p>
              </div>
            </div>
          </div>
        </div>


        <div *ngIf="i % 2 == 0" class="col-md-4 col-lg-6"></div>

      </ng-container>
    </div>
  </div>
</div>
