<section class="page-shell work-index">
  <div class="container">
    <header class="section-head" appReveal>
      <div>
        <span class="eyebrow">{{ 'work.eyebrow' | translate }}</span>
        <h1>{{ 'work.title' | translate }}</h1>
      </div>
      <p>{{ 'work.intro' | translate }}</p>
    </header>

    <div class="work-list" *ngIf="projects$ | async as projects">
      <article class="work-entry" *ngFor="let project of projects; let i = index; trackBy: trackByProject"
               appReveal [revealDelay]="i * 100">
        <a [routerLink]="['/project', project.slug]" class="work-link">
          <div class="work-number mono">0{{ i + 1 }}</div>
          <div class="work-copy">
            <div class="work-meta mono">
              <span>{{ project.type }}</span><span>{{ project.period }}</span><span>{{ project.status }}</span>
            </div>
            <h2>{{ project.title }}</h2>
            <p>{{ project.summary }}</p>
            <div class="decision-preview">
              <span *ngFor="let decision of project.decisions | slice:0:3">{{ decision.title }}</span>
            </div>
          </div>
          <div class="work-action">
            <span>{{ 'work.readCase' | translate }}</span><app-icon name="arrow"></app-icon>
          </div>
        </a>
      </article>
    </div>
  </div>
</section>
