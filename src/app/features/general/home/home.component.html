<div id="home" class="home-hero">
  <div class="container-lg px-sm-5 px-4">
    <!-- Hero Section -->
    <div class="row align-items-center min-vh-75">
      <div class="col-12 col-lg-6 order-lg-2 mb-5 mb-lg-0">
        <div class="hero-image-container">
          <img [src]="home?.image" class="hero-image img-fluid rounded-4 shadow-lg" alt="Home image">
          <div class="image-decoration"></div>
        </div>
      </div>
      
      <div class="col-12 col-lg-6 order-lg-1">
        <div class="hero-content">
          <h1 class="hero-title mb-4">
            {{ 'home.greeting' | translate }} <span class="highlight">{{ user?.name }}</span>
          </h1>
          <div class="hero-description" [innerHTML]="home?.description"></div>
          <div class="hero-actions mt-4">
            <a [href]="user?.link" target="_blank" rel="noopener noreferrer" 
               class="btn btn-primary btn-lg me-3 rounded-pill">
              <i class="fas fa-external-link-alt me-2"></i>
              {{ 'home.view_portfolio' | translate }}
            </a>
            <a href="#experience" class="btn btn-outline-primary btn-lg rounded-pill">
              <i class="fas fa-briefcase me-2"></i>
              {{ 'modules.experience' | translate }}
            </a>
          </div>
        </div>
      </div>
    </div>

    <!-- Technologies Strip -->
    <div class="tech-strip-container mt-5">
      <div class="tech-strip-label text-center mb-4">
        <h3 class="section-title">{{ 'common.title.main_tech' | translate }}</h3>
      </div>
      <div class="tech-strip-wrapper">
        <swiper-container #swiper class="tech-swiper" loop="true" slides-per-view="6" speed="3000"
          css-mode="false" autoplay-delay="200" grab-cursor="true"
          free-mode="true" centered-slides="false" init="false">
          <swiper-slide *ngFor="let skill of skills">
            <div class="tech-item" [class.has-link]="skill.url">
              <a [href]="skill.url" target="_blank" rel="noopener noreferrer"
                class="tech-link" [style.pointer-events]="skill.url ? 'auto' : 'none'">
                <img [src]="skill.icon" class="tech-icon" alt="{{ skill.name }}">
                <span class="tech-name">{{ skill.name }}</span>
              </a>
            </div>
          </swiper-slide>
        </swiper-container>
      </div>
    </div>
  </div>
</div>
