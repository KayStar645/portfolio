<div id="achievement" class="h-100">
  <div class="container-lg">

    <h1 class="text-center py-5"
      style="font-size: 4.4rem; font-weight: 800">
      <!-- {{ 'modules.achievement' | translate }} -->
    </h1>

    <div class="row g-5 pb-5 mb-5">
      <ng-container *ngFor="let group of groupedAchievements">
        <div class="col-12">
          <h2 class="fw-bold border-bottom pb-2 mb-4 fs-1">
            {{ 'common.title.' + group.type | translate }}
            
          </h2>
        </div>
    
        <ng-container *ngFor="let item of group.items; let i = index">
          <div class="col-lg-6">
            <div class="card p-3 rounded-4"
              style="background-color: var(--bg-color); border: 1px solid var(--secondary)">
              
              <div class="d-flex align-items-center"
                  style=" color: var(--secondary-text); line-height: 1.5;">
                <h5 class="fw-bold fs-5">
                  <span class="text-warning">
                    <i class="fas fa-trophy"></i>
                    {{ item.result }}
                  </span> -
                  <span class="fst-italic">{{ item.name }}</span>
                </h5>
              </div>
              <div class="border-top my-2"></div>

              <div class="d-md-flex">
                <!-- Ảnh trái nếu i lẻ -->
                <div *ngIf="i % 2 === 1" class="me-3 d-none d-md-flex flex-column align-items-center"
                  style="flex: 0 0 35%;">
                  <!-- ảnh nhỏ -->
                  <img [src]="item.image" alt="Logo" class="rounded w-100 zoom-effect" (click)="openZoom(item.image)">
                  <!-- ảnh phóng to -->
                  <div *ngIf="zoomedImage" class="zoom-overlay" (click)="zoomedImage = null">
                    <img [src]="zoomedImage" alt="Zoomed image">
                  </div>
                  <p class="text-center fst-italic text-secondary">
                    {{ item.label }}
                  </p>
                </div>
    
                <div style="flex: 1; color: var(--secondary-text); line-height: 1.5;">
    
                  <div>
                    <p class="pt-2"><i class="fas fa-user-tag me-1"></i> {{ item.role }}</p>
                    <p><i class="fas fa-users me-1"></i> {{ item.team }}</p>
                    <div class="border-top my-2"></div>
                    <p class="pt-2"><i class="fas fa-clock me-2"></i> {{ item.time }}</p>
                    <p><i class="fas fa-map-marker-alt me-2"></i> {{ item.address }}</p>
                  </div>
                </div>
    
                <!-- Ảnh phải nếu i chẵn -->
                <div *ngIf="i % 2 === 0" class="ms-3 d-none d-md-flex flex-column align-items-center"
                  style="flex: 0 0 35%;">
                  <!-- ảnh nhỏ -->
                  <img [src]="item.image" alt="Logo" class="rounded w-100 zoom-effect" (click)="openZoom(item.image)">
                  <!-- ảnh phóng to -->
                  <div *ngIf="zoomedImage" class="zoom-overlay" (click)="zoomedImage = null">
                    <img [src]="zoomedImage" alt="Zoomed image">
                  </div>
                  <p class="text-center fst-italic text-secondary">
                    {{ item.label }}
                  </p>
                </div>
              </div>
            </div>
          </div>
        </ng-container>
      </ng-container>
    </div>

  </div>
</div>
